[package]
name = "eda-pns"
version = "0.1.0"
edition = "2021"

[dependencies]
eda-model = { path = "../model" }
eda-drc = { path = "../drc" }
# the dimensions' geometry (`syncDimension`) and the layers a pad or via is flashed on (`IsFlashedOnLayer`)
eda-connectivity = { path = "../connectivity" }
eda-shape-poly-set = { path = "../shape-poly-set" }
eda-clipper2 = { path = "../clipper2" }

[dev-dependencies]
serde_yaml = { workspace = true }
serde_json = { workspace = true }
# the QA replays (tests/qa_regressions.rs) read KiCad's own boards and projects
eda-kicad = { path = "../kicad" }
# kicad-cli's DRC of a board the router routed (tests/rules_kicad.rs)
eda-kicad-engine = { path = "../kicad-engine" }
