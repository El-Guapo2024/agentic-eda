# Exercises: an all-passive design (no ICs) -- a resistor divider ladder
# with decoupling caps. No control pins, no ICs; exercises
# source_no_ground_net/source_no_power_net warn paths staying quiet via
# net-name heuristics (VIN/GND names) even though no pin is power/ground
# kind. Expected outcome: clean pipeline at all seeds.
parts:
  - reference: R1
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R2
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R3
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R4
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C1
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C2
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
nets:
  - { name: VIN, pins: [R1.1, C1.1] }
  - { name: TAP1, pins: [R1.2, R2.1] }
  - { name: TAP2, pins: [R2.2, R3.1] }
  - { name: TAP3, pins: [R3.2, R4.1, C2.1] }
  - { name: GND, pins: [R4.2, C1.2, C2.2] }
