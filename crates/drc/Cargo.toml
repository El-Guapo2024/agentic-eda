[package]
name = "eda-drc"
version = "0.1.0"
edition = "2021"
description = "Geometry core (shapes, collision, clearance rules, rule expressions, rtree, zone-fill driver, stroke font) for the router, zone filler, connectivity and exporter. Not a design-rule checker: DRC is kicad-cli's."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
eda-model = { path = "../model" }
eda-clipper2 = { path = "../clipper2" }
eda-shape-poly-set = { path = "../shape-poly-set" }
eda-zone-filler = { path = "../zone-filler" }
