[package]
name = "eda-drc"
version = "0.1.0"
edition = "2021"
description = "Geometry core (shapes, collision, clearance rules, rule expressions, rtree, the copper of the zones as their fills hold it, stroke font) for the router, connectivity and exporter. Not a design-rule checker: DRC is kicad-cli's, and so is the zone fill."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
eda-model = { path = "../model" }
# The nets KiCad's netlist gives a lone pin (`eda_engine::nets::unconnected_pad_nets`), which the board file numbers with the others (`A.Net`).
eda-engine = { path = "../engine" }
eda-clipper2 = { path = "../clipper2" }
eda-shape-poly-set = { path = "../shape-poly-set" }
