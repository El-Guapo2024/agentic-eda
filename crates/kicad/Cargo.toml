[package]
name = "eda-kicad"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
eda-model = { path = "../model" }
eda-layout = { path = "../layout" }
eda-engine = { path = "../engine" }
eda-drc = { path = "../drc" }
# Import Graphics: an SVG shape's paths are combined under its fill rule with a union and fractured (`PostprocessNestedPolygons`), as `SHAPE_POLY_SET` does.
eda-clipper2 = { path = "../clipper2" }
eda-shape-poly-set = { path = "../shape-poly-set" }
# The dimension geometry and text (`eda_connectivity::dimension`), the one place they are worked out, for the
# `(dimension ..)` the PCB writer emits. `eda-connectivity` has `eda-kicad` only as a dev-dependency.
eda-connectivity = { path = "../connectivity" }
blake3 = { workspace = true }
# Embedded files (`EMBEDDED_FILES::CompressAndEncode` / `DecompressAndDecode`, common/embedded_files.cpp): KiCad stores them as zstd frames, base64-encoded. The one
# dependency added for them (approved 2026-10-21); no default features (no legacy-format reader, no dictionary builder).
zstd = { version = "0.13", default-features = false }

[features]
# INACTIVE (2026-10-28): the SVG import reads files with the Rust port of nanosvg (`src/svg_import/nanosvg_port.rs`) instead of KiCad's
# nanosvg built by build.rs. Off by default; kept for a future all-Rust build.
rust-nanosvg = []

[build-dependencies]
# Builds KiCad's nanosvg (third_party/nanosvg) for the SVG import (approved 2026-10-28).
cc = "1"

[dev-dependencies]
eda-place = { path = "../place" }
eda-freeroute = { path = "../freeroute" }
