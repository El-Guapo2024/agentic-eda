<?xml version="1.0" encoding="UTF-8"?>
<!-- A 40 x 30 mm board with 3 mm corners, drawn as a stroked rect: a mechanical drawing's outline. -->
<svg xmlns="http://www.w3.org/2000/svg" width="40mm" height="30mm" viewBox="0 0 40 30">
  <rect x="0" y="0" width="40" height="30" rx="3" ry="3" fill="none" stroke="#000000" stroke-width="0.1"/>
</svg>
