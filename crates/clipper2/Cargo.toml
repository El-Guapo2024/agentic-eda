[package]
name = "eda-clipper2"
version = "0.1.0"
edition = "2021"
description = "Clipper2 for the workspace: KiCad's vendored Clipper2 2.0.1 C++ (built with cc), plus the inactive Rust port behind the rust-port feature"
build = "build.rs"
links = "clipper2"

[features]
# INACTIVE (2026-10-28): routes every caller to the Rust port (`src/port`)
# instead of the C++ binding. Off by default; kept for a future all-Rust build.
rust-port = []

[dependencies]

[build-dependencies]
cc = "1"
