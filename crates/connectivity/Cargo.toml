[package]
name = "eda-connectivity"
version = "0.1.0"
edition = "2021"
description = "KiCad's connectivity engine and ratsnest (CN_CONNECTIVITY_ALGO / RN_NET), ported"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
eda-model = { path = "../model" }
eda-clipper2 = { path = "../clipper2" }
eda-shape-poly-set = { path = "../shape-poly-set" }
eda-drc = { path = "../drc" }
delaunator = "1"

[features]
# INACTIVE (2026-10-28): the ratsnest triangulates with the from-scratch
# Delaunator port (`src/delaunay_port.rs`) instead of the `delaunator` crate.
# Off by default; kept for a future all-Rust build.
rust-port = []

[dev-dependencies]
serde_yaml = { workspace = true }
eda-engine = { path = "../engine" }
eda-kicad = { path = "../kicad" }
eda-kicad-engine = { path = "../kicad-engine" }
eda-place = { path = "../place" }
eda-freeroute = { path = "../freeroute" }
