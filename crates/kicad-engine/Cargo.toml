[package]
name = "eda-kicad-engine"
version = "0.1.0"
edition = "2021"
description = "kicad-cli as the batch engine: DRC, ERC and every export, run on the current design.json revision and mapped back to our item ids."

[dependencies]
serde_json = { workspace = true }
eda-model = { path = "../model" }
eda-kicad = { path = "../kicad" }

[dev-dependencies]
eda-engine = { path = "../engine" }
# The stroke font (`kicad_text_segments`): where the ink of a cell's text should be, against kicad-cli's plot of it (tests/tables_sch.rs).
eda-drc = { path = "../drc" }
serde_yaml = { workspace = true }
