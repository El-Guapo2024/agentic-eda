[package]
name = "eda-ops"
version = "0.1.0"
edition = "2021"

[dependencies]
eda-model = { path = "../model" }
eda-gates = { path = "../gates" }
eda-connectivity = { path = "../connectivity" }
# The board outline from Edge.Cuts (`eda_drc::outline`): the summary polygon is kept in step with the shapes.
eda-drc = { path = "../drc" }
# KiCad's PCB clipboard text (`Cmd::PasteClipboard`): the reader that turns it into items.
eda-kicad = { path = "../kicad" }
eda-engine = { path = "../engine" }
eda-clipper2 = { path = "../clipper2" }
eda-shape-poly-set = { path = "../shape-poly-set" }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
serde_yaml = { workspace = true }
