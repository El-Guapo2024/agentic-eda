[workspace]
resolver = "2"
members = [
    "crates/eda","crates/model", "crates/intent", "crates/kicad", "crates/logger", "crates/cli", "crates/layout", "crates/engine", "crates/render", "crates/gates", "crates/interchange", "crates/grid", "crates/place", "crates/bench", "crates/cypress", "crates/judge", "crates/ops", "crates/freeroute", "crates/drc", "crates/connectivity", "crates/clipper2", "crates/shape-poly-set", "crates/zone-filler", "crates/pns", "crates/lint", "crates/kicad-engine"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
starlark = "0.14.2"
allocative = "0.3"
anyhow = "1"
blake3 = "1"


# Dev builds: line tables for our own crates (backtraces keep file:line),
# no debug info for dependencies. Agents compile in parallel on one laptop
# and nobody steps through third-party code, so full debug info for the
# 255 packages in Cargo.lock only cost compile time, link time and disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
