# Ladder rung 4/4: student robotics "control hub". Rung 3 (USB/LDO/MCU +
# IMU + I2C headers + analog inputs + buzzer + battery/buck/PWM-driver/
# H-bridges/servos) plus: a UART co-processor MCU with its own USB-UART
# debug bridge and ESD protection on both USB ports, a third motor
# driver with per-motor current sense feeding the co-processor's ADCs,
# two more servo headers (6 total), 8 status LEDs on an I2C GPIO
# expander, a second I2C bus (on the co-processor), and an RS-485
# transceiver for a field bus. ~100 parts -- this is the escalation
# target: everything upstream loops (schematic/placement/routing) are
# meant to eventually clear.
#
# Notes on stand-in packages (see crates/model/src/footprint.rs builtin()):
# - USB-C (J1) again stands in as PINHEADER-16; MCU (U2) is TSSOP-20; the
#   two momentary switches (SW1/SW2) again use "1206" two-pad footprints.
# - IMU (U3) is a real LGA-package 6-axis part (e.g. ICM-42688-P, 3x2.5mm
#   LGA-14) with no built-in LGA/QFN footprint; SOIC-16 stands in per the
#   ladder brief ("LGA stand-in via SOIC/QFN"). Only the 14 real signals
#   are wired; the two extra SOIC-16 pads are marked nc.
# - The buzzer (BZ1) is a 2-pin magnetic transducer; the two-pad "1210"
#   pattern stands in (no dedicated buzzer footprint in the library).
# - U7 is a real 16-channel I2C PWM driver (e.g. PCA9685, TSSOP-28); no
#   28-pin TSSOP builtin exists, so TSSOP-20 stands in with only the 17
#   pins this design actually uses (VDD/GND/SCL/SDA/OE + 12 PWM
#   channels) wired -- the same truncation pattern used for the IMU.
# - F1 (polyfuse) has no dedicated 2-pin footprint; "1206" stands in.
# - L1 (buck inductor) has no dedicated footprint; "1210" stands in for
#   a small shielded power inductor.
# - U5/U6/U10 are single-channel brushed-DC H-bridge drivers (e.g.
#   DRV8871, real SOIC-8 part, no truncation needed).
# - U8 is a second real TSSOP-20 MCU (e.g. STM32C011F6) used as an I/O
#   co-processor -- programmed over UART bootloader rather than SWD, so
#   no debug header is wired to it (documented rather than a fabricated
#   silent-fail pin).
# - U9 is a real USB-UART bridge (e.g. CH340C, SOIC-8, no truncation).
# - D2/D3 are real 2-channel USB ESD-protection arrays (e.g.
#   USBLC6-2SC6, SOT-23-6, no truncation).
# - U11 is a real I2C GPIO expander (e.g. PCF8574, SOIC-8, no
#   truncation) driving the 8 status LEDs.
# - U12 is a real RS-485 transceiver (e.g. MAX485, SOIC-8, no
#   truncation).
# - R14-R16 (current-sense loads) and the 120-ohm bus terminator R29
#   have no special footprint; plain 0603/passive package covers them.
# - The schema has no mounting-hole primitive (parts/nets/clusters only,
#   no board-fixture markers), so the brief's "mounting-hole markers if
#   the schema allows" is intentionally omitted here.
# Unused expansion GPIOs are marked kind: nc -- lint's
# source_pin_not_connected gate fails hard on any unconnected signal pin.
parts:
  - reference: J1
    edge: true
    mpn: GCT-USB4105-GF-A
    value: "USB-C receptacle"
    package: PINHEADER-16
    pins:
      - { number: "1", name: GND, kind: ground }
      - { number: "2", name: VBUS, kind: power }
      - { number: "3", name: CC1, kind: signal }
      - { number: "4", name: CC2, kind: signal }
      - { number: "5", name: DP1, kind: signal }
      - { number: "6", name: DM1, kind: signal }
      - { number: "7", name: SBU1, kind: nc }
      - { number: "8", name: SBU2, kind: nc }
      - { number: "9", name: NC1, kind: nc }
      - { number: "10", name: NC2, kind: nc }
      - { number: "11", name: NC3, kind: nc }
      - { number: "12", name: NC4, kind: nc }
      - { number: "13", name: NC5, kind: nc }
      - { number: "14", name: NC6, kind: nc }
      - { number: "15", name: SHIELD1, kind: nc }
      - { number: "16", name: SHIELD2, kind: nc }

  - reference: R1
    value: 5.1k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R2
    value: 5.1k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  - reference: U1
    mpn: AMS1117-3.3
    value: "3.3V LDO"
    package: SOT-223
    pins:
      - { number: "1", name: GND, kind: ground }
      - { number: "2", name: VOUT, kind: power }
      - { number: "3", name: VIN, kind: power }
  - reference: C1
    value: 10uF
    package: "0805"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C2
    value: 22uF
    package: "0805"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  - reference: U2
    mpn: STM32C011F6
    value: MCU
    package: TSSOP-20
    pins:
      - { number: "1", name: VDD, kind: power }
      - { number: "2", name: VSS, kind: ground }
      - { number: "3", name: VDDA, kind: power }
      - { number: "4", name: VSSA, kind: ground }
      - { number: "5", name: NRST, kind: signal }
      - { number: "6", name: BOOT0, kind: signal }
      - { number: "7", name: SWDIO, kind: signal }
      - { number: "8", name: SWCLK, kind: signal }
      - { number: "9", name: PA0, kind: signal }
      - { number: "10", name: SCL, kind: signal }
      - { number: "11", name: SDA, kind: signal }
      - { number: "12", name: IMU_INT, kind: signal }
      - { number: "13", name: ADC1, kind: signal }
      - { number: "14", name: ADC2, kind: signal }
      - { number: "15", name: BUZZ_DRIVE, kind: signal }
      - { number: "16", name: PA7, kind: nc }
      - { number: "17", name: USB_DP, kind: signal }
      - { number: "18", name: USB_DM, kind: signal }
      - { number: "19", name: VDD2, kind: power }
      - { number: "20", name: GND2, kind: ground }

  - reference: C3
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C4
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C5
    value: 1uF
    package: "0805"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  - reference: R3
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: SW1
    mpn: EVQ-P7C01P
    value: "reset button"
    package: "1206"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  - reference: R4
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: SW2
    mpn: EVQ-P7C01P
    value: "boot0 button"
    package: "1206"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  - reference: R5
    value: 330
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: D1
    value: "status LED"
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  - reference: J2
    edge: false
    value: "SWD header"
    package: PINHEADER-4
    pins:
      - { number: "1", name: SWDIO, kind: signal }
      - { number: "2", name: SWCLK, kind: signal }
      - { number: "3", name: GND, kind: ground }
      - { number: "4", name: "3V3", kind: power }

  # --- rung 2 additions ---

  # 6-axis IMU (accel+gyro), I2C, LGA-14 real part standing in on SOIC-16.
  - reference: U3
    mpn: ICM-42688-P
    value: "6-axis IMU"
    package: SOIC-16
    pins:
      - { number: "1", name: VDD, kind: power }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: SCL, kind: signal }
      - { number: "4", name: SDA, kind: signal }
      - { number: "5", name: INT1, kind: signal }
      - { number: "6", name: AP_AD0, kind: signal }
      - { number: "7", name: FSYNC, kind: signal }
      - { number: "8", name: REGOUT, kind: power }
      - { number: "9", name: VDDIO, kind: power }
      - { number: "10", name: RESV1, kind: nc }
      - { number: "11", name: RESV2, kind: nc }
      - { number: "12", name: RESV3, kind: nc }
      - { number: "13", name: RESV4, kind: nc }
      - { number: "14", name: CS, kind: power }
      - { number: "15", name: PAD1, kind: nc }
      - { number: "16", name: PAD2, kind: nc }
  - reference: C6
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C7
    value: "1uF"
    package: "0805"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # Shared I2C bus pull-ups (one bus feeding the IMU + 4 headers).
  - reference: R6
    value: 4.7k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R7
    value: 4.7k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # Four I2C sensor headers (VCC, GND, SCL, SDA) on the shared bus.
  - reference: J3
    edge: true
    value: "I2C sensor header"
    package: PINHEADER-4
    pins:
      - { number: "1", name: "3V3", kind: power }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: SCL, kind: signal }
      - { number: "4", name: SDA, kind: signal }
  - reference: J4
    edge: true
    value: "I2C sensor header"
    package: PINHEADER-4
    pins:
      - { number: "1", name: "3V3", kind: power }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: SCL, kind: signal }
      - { number: "4", name: SDA, kind: signal }
  - reference: J5
    edge: true
    value: "I2C sensor header"
    package: PINHEADER-4
    pins:
      - { number: "1", name: "3V3", kind: power }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: SCL, kind: signal }
      - { number: "4", name: SDA, kind: signal }
  - reference: J6
    edge: true
    value: "I2C sensor header"
    package: PINHEADER-4
    pins:
      - { number: "1", name: "3V3", kind: power }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: SCL, kind: signal }
      - { number: "4", name: SDA, kind: signal }

  # Two analog inputs, each an RC low-pass anti-alias filter ahead of an
  # MCU ADC pin.
  - reference: J7
    edge: true
    value: "analog input 1"
    package: PINHEADER-2
    pins:
      - { number: "1", name: AIN1, kind: signal }
      - { number: "2", name: GND, kind: ground }
  - reference: R8
    value: 1k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C8
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  - reference: J8
    edge: true
    value: "analog input 2"
    package: PINHEADER-2
    pins:
      - { number: "1", name: AIN2, kind: signal }
      - { number: "2", name: GND, kind: ground }
  - reference: R9
    value: 1k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C9
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # Buzzer driver: GPIO -> base resistor -> NPN switch -> magnetic buzzer.
  - reference: R10
    value: 1k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: Q1
    mpn: MMBT2222A
    value: "NPN switch"
    package: SOT-23
    pins:
      - { number: "1", name: BASE, kind: signal }
      - { number: "2", name: EMITTER, kind: ground }
      - { number: "3", name: COLLECTOR, kind: signal }
  - reference: BZ1
    value: "magnetic buzzer"
    package: "1210"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # --- rung 3 additions ---

  # Battery input: fuse + P-FET reverse-polarity protection.
  - reference: J9
    edge: true
    value: "battery input (2S LiPo)"
    package: PINHEADER-2
    pins:
      - { number: "1", name: VBAT_RAW, kind: power }
      - { number: "2", name: GND, kind: ground }
  - reference: F1
    value: "1A polyfuse"
    package: "1206"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: Q2
    mpn: SQ2345
    value: "P-FET reverse-polarity"
    package: SOT-23
    pins:
      - { number: "1", name: SOURCE, kind: power }
      - { number: "2", name: GATE, kind: signal }
      - { number: "3", name: DRAIN, kind: power }
  - reference: R11
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # Buck converter: VBAT (protected) -> 5V servo/motor-logic rail.
  - reference: U4
    mpn: TPS563201
    value: "5V buck converter"
    package: SOIC-8
    pins:
      - { number: "1", name: BOOT, kind: power }
      - { number: "2", name: VIN, kind: power }
      - { number: "3", name: EN, kind: signal }
      - { number: "4", name: GND, kind: ground }
      - { number: "5", name: FB, kind: signal }
      - { number: "6", name: NC1, kind: nc }
      - { number: "7", name: SW, kind: signal }
      - { number: "8", name: VIN2, kind: power }
  - reference: L1
    value: "4.7uH power inductor"
    package: "1210"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C10
    value: 10uF
    package: "0805"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C11
    value: 22uF
    package: "0805"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C12
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R12
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R13
    value: 3.3k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # 16-channel I2C PWM driver -- frees the MCU's limited GPIO for 4 servo
  # PWM channels + 2x2 H-bridge input channels.
  - reference: U7
    mpn: PCA9685
    value: "16-ch I2C PWM driver"
    package: TSSOP-20
    pins:
      - { number: "1", name: VDD, kind: power }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: SCL, kind: signal }
      - { number: "4", name: SDA, kind: signal }
      - { number: "5", name: OE, kind: signal }
      - { number: "6", name: LED0_SERVO1, kind: signal }
      - { number: "7", name: LED1_SERVO2, kind: signal }
      - { number: "8", name: LED2_SERVO3, kind: signal }
      - { number: "9", name: LED3_SERVO4, kind: signal }
      - { number: "10", name: LED4_M1IN1, kind: signal }
      - { number: "11", name: LED5_M1IN2, kind: signal }
      - { number: "12", name: LED6_M2IN1, kind: signal }
      - { number: "13", name: LED7_M2IN2, kind: signal }
      - { number: "14", name: LED8_SERVO5, kind: signal }
      - { number: "15", name: LED9_SERVO6, kind: signal }
      - { number: "16", name: LED10_M3IN1, kind: signal }
      - { number: "17", name: LED11_M3IN2, kind: signal }
      - { number: "18", name: NC5, kind: nc }
      - { number: "19", name: NC6, kind: nc }
      - { number: "20", name: NC7, kind: nc }
  - reference: C15
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # Two single-channel brushed-DC H-bridge drivers.
  - reference: U5
    mpn: DRV8871
    value: "H-bridge motor driver 1"
    package: SOIC-8
    pins:
      - { number: "1", name: IN1, kind: signal }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: IN2, kind: signal }
      - { number: "4", name: VM, kind: power }
      - { number: "5", name: OUT2, kind: signal }
      - { number: "6", name: GND2, kind: ground }
      - { number: "7", name: OUT1, kind: signal }
      - { number: "8", name: ISEN, kind: signal }
  - reference: C13
    value: "100uF bulk"
    package: "1210"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: J10
    edge: true
    value: "motor 1 output"
    package: PINHEADER-2
    pins:
      - { number: "1", name: M1_OUT1, kind: signal }
      - { number: "2", name: M1_OUT2, kind: signal }

  - reference: U6
    mpn: DRV8871
    value: "H-bridge motor driver 2"
    package: SOIC-8
    pins:
      - { number: "1", name: IN1, kind: signal }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: IN2, kind: signal }
      - { number: "4", name: VM, kind: power }
      - { number: "5", name: OUT2, kind: signal }
      - { number: "6", name: GND2, kind: ground }
      - { number: "7", name: OUT1, kind: signal }
      - { number: "8", name: ISEN, kind: signal }
  - reference: C14
    value: "100uF bulk"
    package: "1210"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: J11
    edge: true
    value: "motor 2 output"
    package: PINHEADER-2
    pins:
      - { number: "1", name: M2_OUT1, kind: signal }
      - { number: "2", name: M2_OUT2, kind: signal }

  # Four servo headers (signal, 5V, GND) on the buck 5V rail.
  - reference: J12
    edge: true
    value: "servo header 1"
    package: PINHEADER-3
    pins:
      - { number: "1", name: SERVO1, kind: signal }
      - { number: "2", name: "5V", kind: power }
      - { number: "3", name: GND, kind: ground }
  - reference: J13
    edge: true
    value: "servo header 2"
    package: PINHEADER-3
    pins:
      - { number: "1", name: SERVO2, kind: signal }
      - { number: "2", name: "5V", kind: power }
      - { number: "3", name: GND, kind: ground }
  - reference: J14
    edge: true
    value: "servo header 3"
    package: PINHEADER-3
    pins:
      - { number: "1", name: SERVO3, kind: signal }
      - { number: "2", name: "5V", kind: power }
      - { number: "3", name: GND, kind: ground }
  - reference: J15
    edge: true
    value: "servo header 4"
    package: PINHEADER-3
    pins:
      - { number: "1", name: SERVO4, kind: signal }
      - { number: "2", name: "5V", kind: power }
      - { number: "3", name: GND, kind: ground }

  # --- rung 4 additions ---

  # ESD protection on the primary USB-C port (inline with D+/D-).
  - reference: D2
    mpn: USBLC6-2SC6
    value: "USB ESD array"
    package: SOT-23-6
    pins:
      - { number: "1", name: IO1, kind: signal }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: IO2, kind: signal }
      - { number: "4", name: IO2B, kind: signal }
      - { number: "5", name: VBUS, kind: power }
      - { number: "6", name: IO1B, kind: signal }

  # I/O co-processor: handles current sense, the 2nd I2C bus, and the
  # RS-485 field bus, over a UART link to the main MCU (U2).
  - reference: U8
    mpn: STM32C011F6
    value: "I/O co-processor MCU"
    package: TSSOP-20
    pins:
      - { number: "1", name: VDD, kind: power }
      - { number: "2", name: VSS, kind: ground }
      - { number: "3", name: VDDA, kind: power }
      - { number: "4", name: VSSA, kind: ground }
      - { number: "5", name: UART_TXD, kind: signal }
      - { number: "6", name: UART_RXD, kind: signal }
      - { number: "7", name: I2C2_SCL, kind: signal }
      - { number: "8", name: I2C2_SDA, kind: signal }
      - { number: "9", name: ISEN1, kind: signal }
      - { number: "10", name: ISEN2, kind: signal }
      - { number: "11", name: ISEN3, kind: signal }
      - { number: "12", name: BUS_DE_RE, kind: signal }
      - { number: "13", name: BUS_TXD, kind: signal }
      - { number: "14", name: BUS_RXD, kind: signal }
      - { number: "15", name: PB0, kind: nc }
      - { number: "16", name: PB1, kind: nc }
      - { number: "17", name: PB2, kind: nc }
      - { number: "18", name: PB3, kind: nc }
      - { number: "19", name: VDD2, kind: power }
      - { number: "20", name: GND2, kind: ground }
  - reference: C17
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C18
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # USB-UART debug bridge for U8, on its own USB-C-style header (D+/D-
  # only -- power is drawn from the same VBUS as J1, not repeated).
  - reference: U9
    mpn: CH340C
    value: "USB-UART bridge"
    package: SOIC-8
    pins:
      - { number: "1", name: VCC, kind: power }
      - { number: "2", name: TXD, kind: signal }
      - { number: "3", name: RXD, kind: signal }
      - { number: "4", name: GND, kind: ground }
      - { number: "5", name: USB_DM, kind: signal }
      - { number: "6", name: USB_DP, kind: signal }
      - { number: "7", name: RESV, kind: nc }
      - { number: "8", name: VBUS, kind: power }
  - reference: C19
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: J16
    edge: false
