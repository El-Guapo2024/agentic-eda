# Ladder rung 3/4: motor hub. Rung 2 (USB/LDO/MCU + IMU + I2C headers +
# analog inputs + buzzer) plus: battery input with reverse-polarity
# protection and a fuse, a buck converter making a 5V rail, a 16-channel
# I2C PWM driver (frees the MCU's pins, and is how real motor/servo hubs
# generate many independent PWM channels), two single-motor H-bridge
# drivers, and four servo headers on the 5V rail. ~56 parts.
#
# Notes on stand-in packages (see crates/model/src/footprint.rs builtin()):
# - USB-C (J1) again stands in as PINHEADER-16; MCU (U2) is TSSOP-20; the
#   two momentary switches (SW1/SW2) again use "1206" two-pad footprints.
# - IMU (U3) is a real LGA-package 6-axis part (e.g. ICM-42688-P, 3x2.5mm
#   LGA-14) with no built-in LGA/QFN footprint; SOIC-16 stands in per the
#   ladder brief ("LGA stand-in via SOIC/QFN"). Only the 14 real signals
#   are wired; the two extra SOIC-16 pads are marked nc.
# - The buzzer (BZ1) is a 2-pin magnetic transducer; the two-pad "1210"
#   pattern stands in (no dedicated buzzer footprint in the library).
# - U7 is a real 16-channel I2C PWM driver (e.g. PCA9685, TSSOP-28); no
#   28-pin TSSOP builtin exists, so TSSOP-20 stands in with only the 15
#   pins this design actually uses (VDD/GND/SCL/SDA/OE + 10 PWM
#   channels) wired -- the same truncation pattern used for the IMU.
# - F1 (polyfuse) has no dedicated 2-pin footprint; "1206" stands in.
# - L1 (buck inductor) has no dedicated footprint; "1210" stands in for
#   a small shielded power inductor.
# - U5/U6 are single-channel brushed-DC H-bridge drivers (e.g. DRV8871,
#   real SOIC-8 part, no truncation needed).
# Unused expansion GPIOs are marked kind: nc -- lint's
# source_pin_not_connected gate fails hard on any unconnected signal pin.
parts:
  - reference: J1
    edge: true
    mpn: GCT-USB4105-GF-A
    value: "USB-C receptacle"
    package: PINHEADER-16
    pins:
      - { number: "1", name: GND, kind: ground }
      - { number: "2", name: VBUS, kind: power }
      - { number: "3", name: CC1, kind: signal }
      - { number: "4", name: CC2, kind: signal }
      - { number: "5", name: DP1, kind: signal }
      - { number: "6", name: DM1, kind: signal }
      - { number: "7", name: SBU1, kind: nc }
      - { number: "8", name: SBU2, kind: nc }
      - { number: "9", name: NC1, kind: nc }
      - { number: "10", name: NC2, kind: nc }
      - { number: "11", name: NC3, kind: nc }
      - { number: "12", name: NC4, kind: nc }
      - { number: "13", name: NC5, kind: nc }
      - { number: "14", name: NC6, kind: nc }
      - { number: "15", name: SHIELD1, kind: nc }
      - { number: "16", name: SHIELD2, kind: nc }

  - reference: R1
    value: 5.1k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R2
    value: 5.1k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  - reference: U1
    mpn: AMS1117-3.3
    value: "3.3V LDO"
    package: SOT-223
    pins:
      - { number: "1", name: GND, kind: ground }
      - { number: "2", name: VOUT, kind: power }
      - { number: "3", name: VIN, kind: power }
  - reference: C1
    value: 10uF
    package: "0805"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C2
    value: 22uF
    package: "0805"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  - reference: U2
    mpn: STM32C011F6
    value: MCU
    package: TSSOP-20
    pins:
      - { number: "1", name: VDD, kind: power }
      - { number: "2", name: VSS, kind: ground }
      - { number: "3", name: VDDA, kind: power }
      - { number: "4", name: VSSA, kind: ground }
      - { number: "5", name: NRST, kind: signal }
      - { number: "6", name: BOOT0, kind: signal }
      - { number: "7", name: SWDIO, kind: signal }
      - { number: "8", name: SWCLK, kind: signal }
      - { number: "9", name: PA0, kind: signal }
      - { number: "10", name: SCL, kind: signal }
      - { number: "11", name: SDA, kind: signal }
      - { number: "12", name: IMU_INT, kind: signal }
      - { number: "13", name: ADC1, kind: signal }
      - { number: "14", name: ADC2, kind: signal }
      - { number: "15", name: BUZZ_DRIVE, kind: signal }
      - { number: "16", name: PA7, kind: nc }
      - { number: "17", name: USB_DP, kind: signal }
      - { number: "18", name: USB_DM, kind: signal }
      - { number: "19", name: VDD2, kind: power }
      - { number: "20", name: GND2, kind: ground }

  - reference: C3
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C4
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C5
    value: 1uF
    package: "0805"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  - reference: R3
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: SW1
    mpn: EVQ-P7C01P
    value: "reset button"
    package: "1206"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  - reference: R4
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: SW2
    mpn: EVQ-P7C01P
    value: "boot0 button"
    package: "1206"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  - reference: R5
    value: 330
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: D1
    value: "status LED"
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  - reference: J2
    edge: false
    value: "SWD header"
    package: PINHEADER-4
    pins:
      - { number: "1", name: SWDIO, kind: signal }
      - { number: "2", name: SWCLK, kind: signal }
      - { number: "3", name: GND, kind: ground }
      - { number: "4", name: "3V3", kind: power }

  # --- rung 2 additions ---

  # 6-axis IMU (accel+gyro), I2C, LGA-14 real part standing in on SOIC-16.
  - reference: U3
    mpn: ICM-42688-P
    value: "6-axis IMU"
    package: SOIC-16
    pins:
      - { number: "1", name: VDD, kind: power }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: SCL, kind: signal }
      - { number: "4", name: SDA, kind: signal }
      - { number: "5", name: INT1, kind: signal }
      - { number: "6", name: AP_AD0, kind: signal }
      - { number: "7", name: FSYNC, kind: signal }
      - { number: "8", name: REGOUT, kind: power }
      - { number: "9", name: VDDIO, kind: power }
      - { number: "10", name: RESV1, kind: nc }
      - { number: "11", name: RESV2, kind: nc }
      - { number: "12", name: RESV3, kind: nc }
      - { number: "13", name: RESV4, kind: nc }
      - { number: "14", name: CS, kind: power }
      - { number: "15", name: PAD1, kind: nc }
      - { number: "16", name: PAD2, kind: nc }
  - reference: C6
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C7
    value: "1uF"
    package: "0805"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # Shared I2C bus pull-ups (one bus feeding the IMU + 4 headers).
  - reference: R6
    value: 4.7k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R7
    value: 4.7k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # Four I2C sensor headers (VCC, GND, SCL, SDA) on the shared bus.
  - reference: J3
    edge: true
    value: "I2C sensor header"
    package: PINHEADER-4
    pins:
      - { number: "1", name: "3V3", kind: power }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: SCL, kind: signal }
      - { number: "4", name: SDA, kind: signal }
  - reference: J4
    edge: true
    value: "I2C sensor header"
    package: PINHEADER-4
    pins:
      - { number: "1", name: "3V3", kind: power }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: SCL, kind: signal }
      - { number: "4", name: SDA, kind: signal }
  - reference: J5
    edge: true
    value: "I2C sensor header"
    package: PINHEADER-4
    pins:
      - { number: "1", name: "3V3", kind: power }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: SCL, kind: signal }
      - { number: "4", name: SDA, kind: signal }
  - reference: J6
    edge: true
    value: "I2C sensor header"
    package: PINHEADER-4
    pins:
      - { number: "1", name: "3V3", kind: power }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: SCL, kind: signal }
      - { number: "4", name: SDA, kind: signal }

  # Two analog inputs, each an RC low-pass anti-alias filter ahead of an
  # MCU ADC pin.
  - reference: J7
    edge: true
    value: "analog input 1"
    package: PINHEADER-2
    pins:
      - { number: "1", name: AIN1, kind: signal }
      - { number: "2", name: GND, kind: ground }
  - reference: R8
    value: 1k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C8
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  - reference: J8
    edge: true
    value: "analog input 2"
    package: PINHEADER-2
    pins:
      - { number: "1", name: AIN2, kind: signal }
      - { number: "2", name: GND, kind: ground }
  - reference: R9
    value: 1k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C9
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # Buzzer driver: GPIO -> base resistor -> NPN switch -> magnetic buzzer.
  - reference: R10
    value: 1k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: Q1
    mpn: MMBT2222A
    value: "NPN switch"
    package: SOT-23
    pins:
      - { number: "1", name: BASE, kind: signal }
      - { number: "2", name: EMITTER, kind: ground }
      - { number: "3", name: COLLECTOR, kind: signal }
  - reference: BZ1
    value: "magnetic buzzer"
    package: "1210"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # --- rung 3 additions ---

  # Battery input: fuse + P-FET reverse-polarity protection.
  - reference: J9
    edge: true
    value: "battery input (2S LiPo)"
    package: PINHEADER-2
    pins:
      - { number: "1", name: VBAT_RAW, kind: power }
      - { number: "2", name: GND, kind: ground }
  - reference: F1
    value: "1A polyfuse"
    package: "1206"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: Q2
    mpn: SQ2345
    value: "P-FET reverse-polarity"
    package: SOT-23
    pins:
      - { number: "1", name: SOURCE, kind: power }
      - { number: "2", name: GATE, kind: signal }
      - { number: "3", name: DRAIN, kind: power }
  - reference: R11
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # Buck converter: VBAT (protected) -> 5V servo/motor-logic rail.
  - reference: U4
    mpn: TPS563201
    value: "5V buck converter"
    package: SOIC-8
    pins:
      - { number: "1", name: BOOT, kind: power }
      - { number: "2", name: VIN, kind: power }
      - { number: "3", name: EN, kind: signal }
      - { number: "4", name: GND, kind: ground }
      - { number: "5", name: FB, kind: signal }
      - { number: "6", name: NC1, kind: nc }
      - { number: "7", name: SW, kind: signal }
      - { number: "8", name: VIN2, kind: power }
  - reference: L1
    value: "4.7uH power inductor"
    package: "1210"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C10
    value: 10uF
    package: "0805"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C11
    value: 22uF
    package: "0805"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C12
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R12
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R13
    value: 3.3k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # 16-channel I2C PWM driver -- frees the MCU's limited GPIO for 4 servo
  # PWM channels + 2x2 H-bridge input channels.
  - reference: U7
    mpn: PCA9685
    value: "16-ch I2C PWM driver"
    package: TSSOP-20
    pins:
      - { number: "1", name: VDD, kind: power }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: SCL, kind: signal }
      - { number: "4", name: SDA, kind: signal }
      - { number: "5", name: OE, kind: signal }
      - { number: "6", name: LED0_SERVO1, kind: signal }
      - { number: "7", name: LED1_SERVO2, kind: signal }
      - { number: "8", name: LED2_SERVO3, kind: signal }
      - { number: "9", name: LED3_SERVO4, kind: signal }
      - { number: "10", name: LED4_M1IN1, kind: signal }
      - { number: "11", name: LED5_M1IN2, kind: signal }
      - { number: "12", name: LED6_M2IN1, kind: signal }
      - { number: "13", name: LED7_M2IN2, kind: signal }
      - { number: "14", name: NC1, kind: nc }
      - { number: "15", name: NC2, kind: nc }
      - { number: "16", name: NC3, kind: nc }
      - { number: "17", name: NC4, kind: nc }
      - { number: "18", name: NC5, kind: nc }
      - { number: "19", name: NC6, kind: nc }
      - { number: "20", name: NC7, kind: nc }
  - reference: C15
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]

  # Two single-channel brushed-DC H-bridge drivers.
  - reference: U5
    mpn: DRV8871
    value: "H-bridge motor driver 1"
    package: SOIC-8
    pins:
      - { number: "1", name: IN1, kind: signal }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: IN2, kind: signal }
      - { number: "4", name: VM, kind: power }
      - { number: "5", name: OUT2, kind: signal }
      - { number: "6", name: GND2, kind: ground }
      - { number: "7", name: OUT1, kind: signal }
      - { number: "8", name: ISEN, kind: ground }
  - reference: C13
    value: "100uF bulk"
    package: "1210"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: J10
    edge: true
    value: "motor 1 output"
    package: PINHEADER-2
    pins:
      - { number: "1", name: M1_OUT1, kind: signal }
      - { number: "2", name: M1_OUT2, kind: signal }

  - reference: U6
    mpn: DRV8871
    value: "H-bridge motor driver 2"
    package: SOIC-8
    pins:
      - { number: "1", name: IN1, kind: signal }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: IN2, kind: signal }
      - { number: "4", name: VM, kind: power }
      - { number: "5", name: OUT2, kind: signal }
      - { number: "6", name: GND2, kind: ground }
      - { number: "7", name: OUT1, kind: signal }
      - { number: "8", name: ISEN, kind: ground }
  - reference: C14
    value: "100uF bulk"
    package: "1210"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: J11
    edge: true
    value: "motor 2 output"
    package: PINHEADER-2
    pins:
      - { number: "1", name: M2_OUT1, kind: signal }
      - { number: "2", name: M2_OUT2, kind: signal }

  # Four servo headers (signal, 5V, GND) on the buck 5V rail.
  - reference: J12
    edge: true
    value: "servo header 1"
    package: PINHEADER-3
    pins:
      - { number: "1", name: SERVO1, kind: signal }
      - { number: "2", name: "5V", kind: power }
      - { number: "3", name: GND, kind: ground }
  - reference: J13
    edge: true
    value: "servo header 2"
    package: PINHEADER-3
    pins:
      - { number: "1", name: SERVO2, kind: signal }
      - { number: "2", name: "5V", kind: power }
      - { number: "3", name: GND, kind: ground }
  - reference: J14
    edge: true
    value: "servo header 3"
    package: PINHEADER-3
    pins:
      - { number: "1", name: SERVO3, kind: signal }
      - { number: "2", name: "5V", kind: power }
      - { number: "3", name: GND, kind: ground }
  - reference: J15
    edge: true
    value: "servo header 4"
    package: PINHEADER-3
    pins:
      - { number: "1", name: SERVO4, kind: signal }
      - { number: "2", name: "5V", kind: power }
      - { number: "3", name: GND, kind: ground }

nets:
  - { name: VBUS, pins: [J1.2, U1.3] }
  - name: GND
    pins:
      [
        J1.1, U1.1, C1.2, C2.2, C3.2, C4.2, C5.2, R1.2, R2.2, R4.2, SW1.2, SW2.2,
        D1.2, J2.3, U2.2, U2.4, U2.20, U3.2, C6.2, C7.2, J3.2, J4.2, J5.2, J6.2,
        J7.2, J8.2, Q1.2, C8.2, C9.2, J9.2, R11.2, U4.4, C10.2, C11.2, C12.2,
        R13.2, U7.2, U7.5, C15.2, U5.2, U5.6, U5.8, C13.2, U6.2, U6.6, U6.8,
