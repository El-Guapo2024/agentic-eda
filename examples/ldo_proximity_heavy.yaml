# Exercises: many proximity placement_rules constraints at once (stresses
# the annealing placer's constraint satisfaction). Expected outcome: clean
# pipeline at all seeds.
parts:
  - reference: U1
    mpn: AMS1117-3.3
    value: "3.3V LDO"
    package: SOT-223
    pins:
      - { number: "1", name: GND, kind: ground }
      - { number: "2", name: VOUT, kind: power }
      - { number: "3", name: VIN, kind: power }
  - reference: C1
    value: 10uF
    package: "0805"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C2
    value: 22uF
    package: "0805"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C3
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C4
    value: 100nF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R1
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: D1
    value: PWR_LED
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: J1
    value: HDR
    package: PINHEADER-3
    pins:
      - { number: "1", name: VIN, kind: power }
      - { number: "2", name: GND, kind: ground }
      - { number: "3", name: VOUT, kind: power }
nets:
  - { name: VIN, pins: [U1.3, C1.1, C3.1, J1.1] }
  - { name: GND, pins: [U1.1, C1.2, C2.2, C3.2, C4.2, D1.2, J1.2] }
  - { name: VOUT, pins: [U1.2, C2.1, C4.1, R1.1, J1.3] }
  - { name: LED_A, pins: [R1.2, D1.1] }
placement_rules:
  - { kind: proximity, a: U1, b: C1, max_mm: 2.0 }
  - { kind: proximity, a: U1, b: C2, max_mm: 2.0 }
  - { kind: proximity, a: U1, b: C3, max_mm: 1.5 }
  - { kind: proximity, a: U1, b: C4, max_mm: 1.5 }
  - { kind: proximity, a: C1, b: C3, max_mm: 3.0 }
  - { kind: proximity, a: C2, b: C4, max_mm: 3.0 }
  - { kind: proximity, a: R1, b: D1, max_mm: 2.5 }
  - { kind: proximity, a: U1, b: J1, max_mm: 8.0 }
