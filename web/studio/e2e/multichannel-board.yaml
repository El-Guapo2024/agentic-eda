# The board web/studio/e2e/multichannel.check.js runs on (GAPS.md package P24): three identical amplifier channels, each a SOIC-8 op-amp with an input resistor, a feedback
# resistor and a compensation capacitor across it, on nets of their own, the supply and the ground shared by all three. `eda board new web/studio/e2e/multichannel-board.yaml -o <dir>`,
# then `eda board serve -C <dir>`. The studio derives one module sheet per amplifier (OPAMP (U1), OPAMP (U2), OPAMP (U3)): the one channel placed three times, which is what
# Generate Placement Rule Areas makes a rule area of and Repeat Layout copies. The project gives each footprint a component class for its sheet (`sheet_classes`), so the
# Component Classes tab of the dialog lists the same three channels.
parts:
  - reference: U1
    mpn: LM358
    value: OPAMP
    package: SOIC-8
    pins:
      - { number: "1", name: OUT, kind: signal }
      - { number: "2", name: IN-, kind: signal }
      - { number: "3", name: IN+, kind: signal }
      - { number: "4", name: VEE, kind: ground }
      - { number: "5", name: NC5, kind: nc }
      - { number: "6", name: NC6, kind: nc }
      - { number: "7", name: NC7, kind: nc }
      - { number: "8", name: VCC, kind: power }
  - reference: R1
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R2
    value: 100k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C1
    value: 10pF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: U2
    mpn: LM358
    value: OPAMP
    package: SOIC-8
    pins:
      - { number: "1", name: OUT, kind: signal }
      - { number: "2", name: IN-, kind: signal }
      - { number: "3", name: IN+, kind: signal }
      - { number: "4", name: VEE, kind: ground }
      - { number: "5", name: NC5, kind: nc }
      - { number: "6", name: NC6, kind: nc }
      - { number: "7", name: NC7, kind: nc }
      - { number: "8", name: VCC, kind: power }
  - reference: R3
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R4
    value: 100k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C2
    value: 10pF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: U3
    mpn: LM358
    value: OPAMP
    package: SOIC-8
    pins:
      - { number: "1", name: OUT, kind: signal }
      - { number: "2", name: IN-, kind: signal }
      - { number: "3", name: IN+, kind: signal }
      - { number: "4", name: VEE, kind: ground }
      - { number: "5", name: NC5, kind: nc }
      - { number: "6", name: NC6, kind: nc }
      - { number: "7", name: NC7, kind: nc }
      - { number: "8", name: VCC, kind: power }
  - reference: R5
    value: 10k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: R6
    value: 100k
    package: "0603"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
  - reference: C3
    value: 10pF
    package: "0402"
    pins: [{ number: "1", kind: passive }, { number: "2", kind: passive }]
nets:
  - { name: VCC, pins: [U1.8, U2.8, U3.8] }
  - { name: GND, pins: [U1.4, U1.3, U2.4, U2.3, U3.4, U3.3] }
  - { name: IN1, pins: [R1.1] }
  - { name: SUM1, pins: [R1.2, R2.1, C1.1, U1.2] }
  - { name: OUT1, pins: [U1.1, R2.2, C1.2] }
  - { name: IN2, pins: [R3.1] }
  - { name: SUM2, pins: [R3.2, R4.1, C2.1, U2.2] }
  - { name: OUT2, pins: [U2.1, R4.2, C2.2] }
  - { name: IN3, pins: [R5.1] }
  - { name: SUM3, pins: [R5.2, R6.1, C3.1, U3.2] }
  - { name: OUT3, pins: [U3.1, R6.2, C3.2] }
board:
  component_classes:
    sheet_classes: true
  grid: 254
  track_width: 200
  clearance: 200
  outline:
    - { x: 0, y: 0 }
    - { x: 40000, y: 0 }
    - { x: 40000, y: 27000 }
    - { x: 0, y: 27000 }
